name: Feature request
description: Propose a generally useful UnoRAG capability
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should UnoRAG solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the product behavior, not only a library choice.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: impact
    attributes:
      label: Security, migration, and operations impact
      description: Note effects on ACL, data ownership, deployment, compatibility, observability, and recovery.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal is generally useful and does not require a paid source edition.
          required: true
        - label: I did not include customer-confidential material.
          required: true
