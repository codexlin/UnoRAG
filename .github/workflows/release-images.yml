name: release-images

# Build each target once and publish it to GHCR. When all four ACR secrets are
# configured, the same image is mirrored to ACR for mainland China deployments.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip registry login and push"
        type: boolean
        default: true
      image_tag:
        description: "Version tag (never 'latest'; empty -> sha-XXXXXXXXXXXX)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-maybe-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject legacy brand names
        run: ./scripts/check_brand_residue.sh

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-}"
          if [[ -z "${tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "${tag}" ]]; then
            tag="sha-${GITHUB_SHA::12}"
          fi
          if [[ "${tag}" == "latest" || ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid or floating image tag: ${tag}" >&2
            exit 1
          fi

          dry_run=true
          if [[ "${EVENT_NAME}" == "push" || ( "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_DRY_RUN}" == "false" ) ]]; then
            dry_run=false
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${dry_run}" == "false" ]]; then
            ghcr_repo="ghcr.io/${owner}/unorag"
            acr_values=("${ACR_REGISTRY:-}" "${ACR_NAMESPACE:-}" "${ACR_USERNAME:-}" "${ACR_PASSWORD:-}")
            configured=0
            for value in "${acr_values[@]}"; do
              [[ -n "${value}" ]] && configured=$((configured + 1))
            done
            if [[ "${configured}" != "0" && "${configured}" != "4" ]]; then
              echo "ACR mirroring requires ACR_REGISTRY, ACR_NAMESPACE, ACR_USERNAME and ACR_PASSWORD together" >&2
              exit 1
            fi
            if [[ "${configured}" == "4" ]]; then
              acr_repo="${ACR_REGISTRY}/${ACR_NAMESPACE}/unorag"
              echo "web_tags=${ghcr_repo}:web-${tag},${acr_repo}:web-${tag}" >> "${GITHUB_OUTPUT}"
              echo "ops_tags=${ghcr_repo}:ops-${tag},${acr_repo}:ops-${tag}" >> "${GITHUB_OUTPUT}"
              echo "worker_tags=${ghcr_repo}:worker-${tag},${acr_repo}:worker-${tag}" >> "${GITHUB_OUTPUT}"
              echo "migrator_tags=${ghcr_repo}:migrator-${tag},${acr_repo}:migrator-${tag}" >> "${GITHUB_OUTPUT}"
              echo "acr_repo=${acr_repo}" >> "${GITHUB_OUTPUT}"
              echo "publish_acr=true" >> "${GITHUB_OUTPUT}"
            else
              echo "web_tags=${ghcr_repo}:web-${tag}" >> "${GITHUB_OUTPUT}"
              echo "ops_tags=${ghcr_repo}:ops-${tag}" >> "${GITHUB_OUTPUT}"
              echo "worker_tags=${ghcr_repo}:worker-${tag}" >> "${GITHUB_OUTPUT}"
              echo "migrator_tags=${ghcr_repo}:migrator-${tag}" >> "${GITHUB_OUTPUT}"
              echo "publish_acr=false" >> "${GITHUB_OUTPUT}"
            fi
            echo "ghcr_repo=${ghcr_repo}" >> "${GITHUB_OUTPUT}"
            echo "web_scan_ref=${ghcr_repo}:web-${tag}" >> "${GITHUB_OUTPUT}"
            echo "ops_scan_ref=${ghcr_repo}:ops-${tag}" >> "${GITHUB_OUTPUT}"
            echo "worker_scan_ref=${ghcr_repo}:worker-${tag}" >> "${GITHUB_OUTPUT}"
            echo "migrator_scan_ref=${ghcr_repo}:migrator-${tag}" >> "${GITHUB_OUTPUT}"
          else
            echo "web_tags=unorag-web:${tag}" >> "${GITHUB_OUTPUT}"
            echo "ops_tags=unorag-web-ops:${tag}" >> "${GITHUB_OUTPUT}"
            echo "worker_tags=unorag-web-worker:${tag}" >> "${GITHUB_OUTPUT}"
            echo "migrator_tags=unorag-web-migrator:${tag}" >> "${GITHUB_OUTPUT}"
            echo "web_scan_ref=unorag-web:${tag}" >> "${GITHUB_OUTPUT}"
            echo "ops_scan_ref=unorag-web-ops:${tag}" >> "${GITHUB_OUTPUT}"
            echo "worker_scan_ref=unorag-web-worker:${tag}" >> "${GITHUB_OUTPUT}"
            echo "migrator_scan_ref=unorag-web-migrator:${tag}" >> "${GITHUB_OUTPUT}"
            echo "publish_acr=false" >> "${GITHUB_OUTPUT}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "dbos_version=unorag-${GITHUB_SHA::16}" >> "${GITHUB_OUTPUT}"
          echo "image_platform=linux/amd64" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${dry_run}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag=${tag} dbos_version=unorag-${GITHUB_SHA::16} dry_run=${dry_run}"

      - name: Log in to ACR
        if: steps.meta.outputs.publish_acr == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to GHCR
        if: steps.meta.outputs.dry_run != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish web runner
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: runner
          platforms: linux/amd64
          cache-from: type=gha,scope=unorag-runner
          cache-to: type=gha,mode=max,scope=unorag-runner
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.web_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: ${{ steps.meta.outputs.dry_run != 'true' }}
          provenance: ${{ steps.meta.outputs.dry_run != 'true' }}

      - name: Build and publish web migrator
        id: migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: migrator
          platforms: linux/amd64
          cache-from: type=gha,scope=unorag-migrator
          cache-to: type=gha,mode=max,scope=unorag-migrator
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.migrator_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: ${{ steps.meta.outputs.dry_run != 'true' }}
          provenance: ${{ steps.meta.outputs.dry_run != 'true' }}

      - name: Build and publish ops image
        id: ops
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: ops
          platforms: linux/amd64
          cache-from: type=gha,scope=unorag-ops
          cache-to: type=gha,mode=max,scope=unorag-ops
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.ops_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: ${{ steps.meta.outputs.dry_run != 'true' }}
          provenance: ${{ steps.meta.outputs.dry_run != 'true' }}

      - name: Build and publish DBOS worker
        id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: worker
          platforms: linux/amd64
          cache-from: type=gha,scope=unorag-worker
          cache-to: type=gha,mode=max,scope=unorag-worker
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.worker_tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: ${{ steps.meta.outputs.dry_run != 'true' }}
          provenance: ${{ steps.meta.outputs.dry_run != 'true' }}

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.web_scan_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan web migrator image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.migrator_scan_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan ops image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.ops_scan_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan DBOS worker image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.worker_scan_ref }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Emit release manifests
        env:
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          TAG: ${{ steps.meta.outputs.tag }}
          DBOS_VERSION: ${{ steps.meta.outputs.dbos_version }}
          IMAGE_PLATFORM: ${{ steps.meta.outputs.image_platform }}
          PUBLISH_ACR: ${{ steps.meta.outputs.publish_acr }}
          ACR_REPO: ${{ steps.meta.outputs.acr_repo }}
          GHCR_REPO: ${{ steps.meta.outputs.ghcr_repo }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          OPS_DIGEST: ${{ steps.ops.outputs.digest }}
          WORKER_DIGEST: ${{ steps.worker.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/unorag-release

          if [[ "${DRY_RUN}" == "true" ]]; then
            cat > /tmp/unorag-release/release-local.env <<EOF
          UNORAG_WEB_IMAGE=unorag-web:${TAG}
          UNORAG_WEB_MIGRATOR_IMAGE=unorag-web-migrator:${TAG}
          UNORAG_WEB_OPS_IMAGE=unorag-web-ops:${TAG}
          UNORAG_DBOS_WORKER_IMAGE=unorag-web-worker:${TAG}
          UNORAG_DBOS_APPLICATION_VERSION=${DBOS_VERSION}
          UNORAG_IMAGE_PLATFORM=${IMAGE_PLATFORM}
          EOF
          else
            for digest in "${WEB_DIGEST}" "${OPS_DIGEST}" "${WORKER_DIGEST}" "${MIGRATOR_DIGEST}"; do
              [[ "${digest}" == sha256:* ]] || { echo "missing image digest" >&2; exit 1; }
            done
            if [[ "${PUBLISH_ACR}" == "true" ]]; then
              cat > /tmp/unorag-release/release-acr.env <<EOF
          UNORAG_WEB_IMAGE=${ACR_REPO}@${WEB_DIGEST}
          UNORAG_WEB_MIGRATOR_IMAGE=${ACR_REPO}@${MIGRATOR_DIGEST}
          UNORAG_WEB_OPS_IMAGE=${ACR_REPO}@${OPS_DIGEST}
          UNORAG_DBOS_WORKER_IMAGE=${ACR_REPO}@${WORKER_DIGEST}
          UNORAG_DBOS_APPLICATION_VERSION=${DBOS_VERSION}
          UNORAG_IMAGE_PLATFORM=${IMAGE_PLATFORM}
          EOF
            fi
            cat > /tmp/unorag-release/release-ghcr.env <<EOF
          UNORAG_WEB_IMAGE=${GHCR_REPO}@${WEB_DIGEST}
          UNORAG_WEB_MIGRATOR_IMAGE=${GHCR_REPO}@${MIGRATOR_DIGEST}
          UNORAG_WEB_OPS_IMAGE=${GHCR_REPO}@${OPS_DIGEST}
          UNORAG_DBOS_WORKER_IMAGE=${GHCR_REPO}@${WORKER_DIGEST}
          UNORAG_DBOS_APPLICATION_VERSION=${DBOS_VERSION}
          UNORAG_IMAGE_PLATFORM=${IMAGE_PLATFORM}
          EOF
          fi

          sed -i 's/^[[:space:]]*//' /tmp/unorag-release/*.env
          grep -R '^UNORAG_.*_IMAGE=' /tmp/unorag-release

      - name: Upload release manifests
        uses: actions/upload-artifact@v7
        with:
          name: unorag-release-${{ steps.meta.outputs.tag }}
          path: /tmp/unorag-release/*.env
          if-no-files-found: error
          retention-days: 30
