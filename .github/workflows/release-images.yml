name: release-images

# Build each target once, then publish the same result to:
# - ACR for mainland China deployments
# - GHCR for overseas deployments
#
# Required repository secrets:
#   ACR_REGISTRY / ACR_USERNAME / ACR_PASSWORD / ACR_NAMESPACE

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; skip registry login and push"
        type: boolean
        default: true
      image_tag:
        description: "Version tag (never 'latest'; empty -> sha-XXXXXXXXXXXX)"
        type: string
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-maybe-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject legacy brand names
        run: ./scripts/check_brand_residue.sh

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-}"
          if [[ -z "${tag}" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ -z "${tag}" ]]; then
            tag="sha-${GITHUB_SHA::12}"
          fi
          if [[ "${tag}" == "latest" || ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "invalid or floating image tag: ${tag}" >&2
            exit 1
          fi

          dry_run=true
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${INPUT_DRY_RUN}" == "false" ]]; then
            dry_run=false
          fi

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${dry_run}" == "false" ]]; then
            if [[ -z "${ACR_REGISTRY:-}" || -z "${ACR_NAMESPACE:-}" ]]; then
              echo "ACR_REGISTRY and ACR_NAMESPACE secrets are required" >&2
              exit 1
            fi
            acr_repo="${ACR_REGISTRY}/${ACR_NAMESPACE}/unorag"
            ghcr_repo="ghcr.io/${owner}/unorag"
            echo "web_tags=${acr_repo}:web-${tag},${ghcr_repo}:web-${tag}" >> "${GITHUB_OUTPUT}"
            echo "api_tags=${acr_repo}:api-${tag},${ghcr_repo}:api-${tag}" >> "${GITHUB_OUTPUT}"
            echo "migrator_tags=${acr_repo}:migrator-${tag},${ghcr_repo}:migrator-${tag}" >> "${GITHUB_OUTPUT}"
            echo "acr_repo=${acr_repo}" >> "${GITHUB_OUTPUT}"
            echo "ghcr_repo=${ghcr_repo}" >> "${GITHUB_OUTPUT}"
          else
            echo "web_tags=unorag-web:${tag}" >> "${GITHUB_OUTPUT}"
            echo "api_tags=unorag-api:${tag}" >> "${GITHUB_OUTPUT}"
            echo "migrator_tags=unorag-web-migrator:${tag}" >> "${GITHUB_OUTPUT}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "dry_run=${dry_run}" >> "${GITHUB_OUTPUT}"
          echo "Resolved tag=${tag} dry_run=${dry_run}"

      - name: Validate ACR credentials
        if: steps.meta.outputs.dry_run != 'true'
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${ACR_USERNAME:-}" ]] || { echo "ACR_USERNAME secret is required" >&2; exit 1; }
          [[ -n "${ACR_PASSWORD:-}" ]] || { echo "ACR_PASSWORD secret is required" >&2; exit 1; }

      - name: Log in to ACR
        if: steps.meta.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Log in to GHCR
        if: steps.meta.outputs.dry_run != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish web runner
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: runner
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.web_tags }}

      - name: Build and publish web migrator
        id: migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: migrator
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.migrator_tags }}

      - name: Build and publish API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: ${{ steps.meta.outputs.dry_run != 'true' }}
          load: ${{ steps.meta.outputs.dry_run == 'true' }}
          tags: ${{ steps.meta.outputs.api_tags }}

      - name: Emit release manifests
        env:
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
          TAG: ${{ steps.meta.outputs.tag }}
          ACR_REPO: ${{ steps.meta.outputs.acr_repo }}
          GHCR_REPO: ${{ steps.meta.outputs.ghcr_repo }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/unorag-release

          if [[ "${DRY_RUN}" == "true" ]]; then
            cat > /tmp/unorag-release/release-local.env <<EOF
          UNORAG_WEB_IMAGE=unorag-web:${TAG}
          UNORAG_WEB_MIGRATOR_IMAGE=unorag-web-migrator:${TAG}
          UNORAG_API_IMAGE=unorag-api:${TAG}
          EOF
          else
            for digest in "${WEB_DIGEST}" "${API_DIGEST}" "${MIGRATOR_DIGEST}"; do
              [[ "${digest}" == sha256:* ]] || { echo "missing image digest" >&2; exit 1; }
            done
            cat > /tmp/unorag-release/release-acr.env <<EOF
          UNORAG_WEB_IMAGE=${ACR_REPO}@${WEB_DIGEST}
          UNORAG_WEB_MIGRATOR_IMAGE=${ACR_REPO}@${MIGRATOR_DIGEST}
          UNORAG_API_IMAGE=${ACR_REPO}@${API_DIGEST}
          EOF
            cat > /tmp/unorag-release/release-ghcr.env <<EOF
          UNORAG_WEB_IMAGE=${GHCR_REPO}@${WEB_DIGEST}
          UNORAG_WEB_MIGRATOR_IMAGE=${GHCR_REPO}@${MIGRATOR_DIGEST}
          UNORAG_API_IMAGE=${GHCR_REPO}@${API_DIGEST}
          EOF
          fi

          sed -i 's/^[[:space:]]*//' /tmp/unorag-release/*.env
          grep -R '^UNORAG_.*_IMAGE=' /tmp/unorag-release

      - name: Upload release manifests
        uses: actions/upload-artifact@v4
        with:
          name: unorag-release-${{ steps.meta.outputs.tag }}
          path: /tmp/unorag-release/*.env
          if-no-files-found: error
          retention-days: 30
