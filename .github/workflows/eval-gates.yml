name: eval-gates

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-ts-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Ask, retrieval, parser, and lifecycle release gates
        run: pnpm test:ts-core
      - name: Public API and policy contracts
        run: pnpm test
