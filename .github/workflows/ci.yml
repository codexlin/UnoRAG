name: ci

# P0 CI closed loop (build / test / image build verify).
# Does NOT push to registry, read production secrets, or SSH deploy.
# Release image push: see release-images.yml (GHCR by default; ACR mirror optional).
# Deploy with approval: deploy.yml (deferred).
#
# This workflow is the single PR/main entrypoint.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C /usr/local/bin gitleaks
      - name: Scan the complete Git history for secrets
        run: gitleaks git . --redact=100

  brand-residue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject legacy brand names
        run: ./scripts/check_brand_residue.sh

  lint-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject conflict markers / whitespace errors
        run: git diff --check origin/main...HEAD || git diff --check HEAD~1...HEAD || git diff --check

  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: unorag_ci
          POSTGRES_USER: unorag_ci
          POSTGRES_PASSWORD: unorag_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unorag_ci -d unorag_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Reject unreviewed production licenses
        run: pnpm licenses:check
      - name: TypeScript core contracts
        run: |
          pnpm typecheck
          pnpm test:ts-core
      - name: Migrate lifecycle transaction database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://unorag_ci:unorag_ci@127.0.0.1:5432/unorag_ci
      - name: Test document version transaction against PostgreSQL
        run: >-
          pnpm exec tsx --test --test-concurrency=1
          tests/ts-core/document-version-command-postgres.test.ts
        env:
          DOCUMENT_VERSION_COMMAND_TEST_DATABASE_URL: postgresql://unorag_ci:unorag_ci@127.0.0.1:5432/unorag_ci
      - name: Test
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # Target-scoped BuildKit caches are reusable by main/release builds.
      - name: Build web runner (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: runner
          cache-from: type=gha,scope=unorag-runner
          cache-to: type=gha,mode=max,scope=unorag-runner
          push: false
          load: true
          tags: unorag-web:ci
      - name: Build web migrator (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: migrator
          cache-from: type=gha,scope=unorag-migrator
          cache-to: type=gha,mode=max,scope=unorag-migrator
          push: false
          load: true
          tags: unorag-web-migrator:ci
      - name: Build ops image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: ops
          cache-from: type=gha,scope=unorag-ops
          cache-to: type=gha,mode=max,scope=unorag-ops
          push: false
          load: true
          tags: unorag-web-ops:ci
      - name: Build DBOS worker (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          target: worker
          cache-from: type=gha,scope=unorag-worker
          cache-to: type=gha,mode=max,scope=unorag-worker
          push: false
          load: true
          tags: unorag-web-worker:ci
