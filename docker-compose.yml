# MeriKnow local infra
# Usage: docker compose up -d
# Verify Qdrant: curl -s http://localhost:6333/readyz
# Verify Postgres: pg_isready -h localhost -U meriknow

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - meriknow_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meriknow
      POSTGRES_USER: meriknow
      POSTGRES_PASSWORD: meriknow
    ports:
      - "5432:5432"
    volumes:
      - meriknow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meriknow -d meriknow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  meriknow_qdrant_data:
  meriknow_postgres_data:
