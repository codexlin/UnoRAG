# UnoRAG local infra
# Usage: docker compose up -d
# Verify Qdrant: curl -s http://localhost:6333/readyz
# Verify Postgres: pg_isready -h localhost -U unorag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - unorag_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: unorag
      POSTGRES_USER: unorag
      POSTGRES_PASSWORD: unorag
    ports:
      - "5432:5432"
    volumes:
      - unorag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unorag -d unorag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  unorag_qdrant_data:
  unorag_postgres_data:
