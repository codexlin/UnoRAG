[project]
name = "unorag"
version = "0.1.0"
description = "Thin Python client for UnoRAG Knowledge API v1 (retrieve / ask)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "UnoRAG" }]
keywords = ["unorag", "rag", "knowledge", "retrieve", "ask"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/codexlin/UnoRAG"
Documentation = "https://github.com/codexlin/UnoRAG/blob/main/sdk/python/README.md"
Contract = "https://github.com/codexlin/UnoRAG/blob/main/docs/contracts/retrieve-ask-v1.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unorag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
