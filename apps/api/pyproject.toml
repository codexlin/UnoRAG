[project]
name = "meriknow-api"
version = "0.1.0"
description = "MeriKnow API — FastAPI + LangChain + LangGraph enterprise knowledge Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.17",
  "httpx>=0.27.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "qdrant-client>=1.12.0",
  "pymupdf>=1.24.0",
  "python-docx>=1.1.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "arq>=0.28.0",
  "redis>=5.3.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
