# Overlay for Aliyun / webch.cn pilot (TLS via Caddy).
# Usage:
#   source scripts/compose-env.sh
#   mk_compose -f docker-compose.yml -f docker-compose.webch.yml up -d
#
# Requires runtime.env: HTTP_PORT=80 and images pinned to preloaded tags.

services:
  caddy:
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.webch.cn:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
