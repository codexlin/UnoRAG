# UnoRAG private-deployment reference topology (L8).
#
# Config model (split by lifecycle / sensitivity):
#   ../config/runtime.env      — non-secret (ConfigMap)
#   ../config/runtime.secret   — secrets (Secret)
#   ../config/bootstrap.env    — one-time bootstrap Job only
#
# Init once:
#   ./scripts/init-config.sh
#
# Always use the helpers. They load --env-file without sourcing secrets and
# remove managed host variables that would otherwise override those files:
#   source scripts/compose-env.sh
#   mk_compose up -d
# Bootstrap/migrate profile:
#   mk_compose_bootstrap --profile migrate run --rm bootstrap
# mk_compose does NOT require bootstrap.env; mk_compose_bootstrap does.
#
# Browser → Caddy :${HTTP_PORT} → web :3000
# FastAPI / lifecycle-worker / outbox-worker are NOT published.

name: ${COMPOSE_PROJECT_NAME:-unorag}

x-dbos-environment: &dbos-environment
  DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://unorag_worker_login:${UNORAG_WORKER_DB_PASSWORD:?UNORAG_WORKER_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
  # Compose interpolates inactive profiles. The sentinel keeps legacy installs
  # parseable; the DBOS process rejects it if the profile is actually started.
  DBOS_SYSTEM_DATABASE_URL: ${DBOS_SYSTEM_DATABASE_URL:-postgresql://unorag_dbos_login:${UNORAG_DBOS_DB_PASSWORD:-dbos-profile-disabled}@postgres:5432/${UNORAG_DBOS_DATABASE:-unorag_dbos}}
  UNORAG_DBOS_APPLICATION_VERSION: ${UNORAG_DBOS_APPLICATION_VERSION:-lifecycle-v2}
  UNORAG_DBOS_LISTEN_QUEUES: lifecycle
  UNORAG_DBOS_CLEANUP_ENABLED: "true"
  UNORAG_DBOS_DOCUMENT_DELETE_ENABLED: ${UNORAG_DBOS_DOCUMENT_DELETE_ENABLED:-false}
  DBOS_SYSTEM_DATABASE_POOL_SIZE: ${DBOS_SYSTEM_DATABASE_POOL_SIZE:-10}
  DBOS_LIFECYCLE_CONCURRENCY: ${DBOS_LIFECYCLE_CONCURRENCY:-2}
  DBOS_CONTROL_POLL_MS: ${DBOS_CONTROL_POLL_MS:-5000}

services:
  # Named volumes default to root:root; web runs as uid 10001 (unorag).
  document-storage-init:
    image: ${UNORAG_WEB_IMAGE:-unorag-web:local}
    user: "0:0"
    volumes:
      - document_storage:/var/lib/unorag/documents
    entrypoint: ["sh", "-c"]
    command:
      - "chown -R unorag:unorag /var/lib/unorag/documents && chmod 775 /var/lib/unorag/documents"
    restart: "no"
    networks:
      - internal

  caddy:
    image: ${CADDY_IMAGE:-caddy:2.9.1-alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - edge
      - internal

  web:
    image: ${UNORAG_WEB_IMAGE:-unorag-web:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RAG_API_URL: http://api:8000
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://unorag_web_login:${UNORAG_WEB_DB_PASSWORD:?UNORAG_WEB_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      SESSION_MEMORY_TTL_SECONDS: ${SESSION_MEMORY_TTL_SECONDS:-3600}
      UNORAG_INTERNAL_SECRET: ${UNORAG_INTERNAL_SECRET:?UNORAG_INTERNAL_SECRET required}
      UNORAG_SESSION_SECRET: ${UNORAG_SESSION_SECRET:?UNORAG_SESSION_SECRET required}
      UNORAG_BUILD_REF: ${UNORAG_WEB_IMAGE:-unorag-web:local}
      UNORAG_TS_RETRIEVAL_MODE: ${UNORAG_TS_RETRIEVAL_MODE:-off}
      UNORAG_ASK_RUNTIME: ${UNORAG_ASK_RUNTIME:-python}
      UNORAG_DBOS_DOCUMENT_DELETE_ENABLED: ${UNORAG_DBOS_DOCUMENT_DELETE_ENABLED:-false}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL required}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-unorag_chunks}
      OPENAI_API_KEY: ${LLM_API_KEY:?LLM_API_KEY required}
      OPENAI_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL required}
      CHAT_MODEL: ${CHAT_MODEL:-qwen-plus}
      AI_SUPPORTS_STRUCTURED_OUTPUTS: ${AI_SUPPORTS_STRUCTURED_OUTPUTS:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL required}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?EMBEDDING_DIM required}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      TS_RETRIEVAL_HYBRID_ENABLED: ${TS_RETRIEVAL_HYBRID_ENABLED:-false}
      TS_RETRIEVAL_RERANK_ENABLED: ${TS_RETRIEVAL_RERANK_ENABLED:-false}
      TS_RETRIEVAL_CORPUS_LIMIT: ${TS_RETRIEVAL_CORPUS_LIMIT:-10000}
      # Container-internal path only (named volume). Do not pass host absolute paths.
      DOCUMENT_STORAGE_ROOT: /var/lib/unorag/documents
      DOCUMENT_MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
    volumes:
      - document_storage:/var/lib/unorag/documents
    depends_on:
      document-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:3000/api/rag/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal
      - edge

  api:
    image: ${UNORAG_API_IMAGE:-unorag-api:local}
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: UnoRAG API
      BUILD_REF: ${UNORAG_API_IMAGE:-unorag-api:local}
      API_PREFIX: /v1
      CORS_ORIGINS: http://localhost,http://127.0.0.1
      # Product invariants (not customer-tunable env knobs)
      ASK_MODE: live
      METADATA_BACKEND: postgres
      INTERNAL_AUTH_ENABLED: "true"
      INTERNAL_AUTH_SECRET: ${UNORAG_INTERNAL_SECRET:?UNORAG_INTERNAL_SECRET required}
      INTERNAL_AUTH_REPLAY_BACKEND: redis
      ACTIVE_GENERATION_GATE_ENABLED: "true"
      ACTIVE_GENERATION_CACHE_TTL_SECONDS: "0"
      MINERU_USE_FAKE: "false"
      DATABASE_URL: ${API_DATABASE_URL:-postgresql+psycopg://unorag_api_login:${UNORAG_API_DB_PASSWORD:?UNORAG_API_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      CONVERSATION_STORE_SCHEMA: ${CONVERSATION_STORE_SCHEMA:-public}
      CONVERSATION_DATABASE_URL: ${CONVERSATION_DATABASE_URL:-}
      RAG_READ_DATABASE_URL: ${RAG_READ_DATABASE_URL:-postgresql://unorag_rag_read_login:${UNORAG_RAG_READ_DB_PASSWORD:?UNORAG_RAG_READ_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL required}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-unorag_chunks}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      DOCUMENT_STORAGE_ROOT: /var/lib/unorag/documents
      MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
      # Transitional mapping: deploy name LLM_* → app OPENAI_*
      OPENAI_API_KEY: ${LLM_API_KEY:?LLM_API_KEY required}
      OPENAI_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL required}
      CHAT_MODEL: ${CHAT_MODEL:?CHAT_MODEL required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL required}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?EMBEDDING_DIM required}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      LLM_MAX_INFLIGHT: ${LLM_MAX_INFLIGHT:-4}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
      MINERU_PROVIDER: ${MINERU_PROVIDER:-self_hosted}
      MINERU_SELF_HOSTED_URL: ${MINERU_SELF_HOSTED_URL:-}
      MINERU_URL: ${MINERU_URL:-}
      MINERU_MODE: ${MINERU_MODE:-auto}
      MINERU_VERSION: ${MINERU_VERSION:-2.5}
      MINERU_PARSE_METHOD: ${MINERU_PARSE_METHOD:-auto}
      EXTERNAL_PARSER_ALLOWED: ${EXTERNAL_PARSER_ALLOWED:-false}
      MINERU_302_BASE_URL: ${MINERU_302_BASE_URL:-https://api.302.ai}
      MINERU_302_UPLOAD_PATH: ${MINERU_302_UPLOAD_PATH:-/302/upload-file}
      MINERU_302_TASK_PATH: ${MINERU_302_TASK_PATH:-/302/v2/mineru/task}
      MINERU_302_POLL_INTERVAL_S: ${MINERU_302_POLL_INTERVAL_S:-5}
      MINERU_302_MAX_WAIT_S: ${MINERU_302_MAX_WAIT_S:-900}
      MINERU_302_COST_PER_PAGE: ${MINERU_302_COST_PER_PAGE:-0.02}
      MINERU_302_DAILY_BUDGET: ${MINERU_302_DAILY_BUDGET:-0}
      MINERU_302_BUDGET_WARN_RATIO: ${MINERU_302_BUDGET_WARN_RATIO:-0.8}
      MINERU_302_LONG_PENDING_S: ${MINERU_302_LONG_PENDING_S:-300}
      LIFECYCLE_WORKER_READY_FILE: /tmp/unorag-lifecycle-ready
      LIFECYCLE_WORKER_POLL_SECONDS: ${LIFECYCLE_WORKER_POLL_SECONDS:-1}
      LIFECYCLE_WORKER_LEASE_SECONDS: ${LIFECYCLE_WORKER_LEASE_SECONDS:-120}
      LIFECYCLE_WORKER_HEARTBEAT_SECONDS: ${LIFECYCLE_WORKER_HEARTBEAT_SECONDS:-30}
    volumes:
      - document_storage:/var/lib/unorag/documents
    depends_on:
      document-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:8000/health | grep -q '\"status\"' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Intentionally no ports: — FastAPI is internal-only (fail-closed edge).
    networks:
      - internal

  lifecycle-worker:
    image: ${UNORAG_API_IMAGE:-unorag-api:local}
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.lifecycle_worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      # Invariants required by Settings production validator
      ASK_MODE: live
      METADATA_BACKEND: postgres
      INTERNAL_AUTH_ENABLED: "true"
      INTERNAL_AUTH_SECRET: ${UNORAG_INTERNAL_SECRET:?UNORAG_INTERNAL_SECRET required}
      INTERNAL_AUTH_REPLAY_BACKEND: redis
      ACTIVE_GENERATION_GATE_ENABLED: "true"
      ACTIVE_GENERATION_CACHE_TTL_SECONDS: "0"
      MINERU_USE_FAKE: "false"
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://unorag_worker_login:${UNORAG_WORKER_DB_PASSWORD:?UNORAG_WORKER_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      RAG_READ_DATABASE_URL: ${RAG_READ_DATABASE_URL:-postgresql://unorag_rag_read_login:${UNORAG_RAG_READ_DB_PASSWORD:?UNORAG_RAG_READ_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      # Settings.database_url fallback; worker DSN is authoritative via WORKER_*
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql://unorag_worker_login:${UNORAG_WORKER_DB_PASSWORD:?UNORAG_WORKER_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL required}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-unorag_chunks}
      REDIS_URL: ${REDIS_URL:?REDIS_URL required}
      DOCUMENT_STORAGE_ROOT: /var/lib/unorag/documents
      MAX_UPLOAD_BYTES: ${DOCUMENT_MAX_UPLOAD_BYTES:-52428800}
      OPENAI_API_KEY: ${LLM_API_KEY:?LLM_API_KEY required}
      OPENAI_BASE_URL: ${LLM_BASE_URL:?LLM_BASE_URL required}
      CHAT_MODEL: ${CHAT_MODEL:?CHAT_MODEL required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL required}
      EMBEDDING_DIM: ${EMBEDDING_DIM:?EMBEDDING_DIM required}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-10}
      LLM_MAX_INFLIGHT: ${LLM_MAX_INFLIGHT:-4}
      MINERU_ENABLED: ${MINERU_ENABLED:-false}
      MINERU_PROVIDER: ${MINERU_PROVIDER:-self_hosted}
      MINERU_SELF_HOSTED_URL: ${MINERU_SELF_HOSTED_URL:-}
      MINERU_URL: ${MINERU_URL:-}
      MINERU_MODE: ${MINERU_MODE:-auto}
      MINERU_VERSION: ${MINERU_VERSION:-2.5}
      MINERU_PARSE_METHOD: ${MINERU_PARSE_METHOD:-auto}
      EXTERNAL_PARSER_ALLOWED: ${EXTERNAL_PARSER_ALLOWED:-false}
      MINERU_302_API_KEY: ${MINERU_302_API_KEY:-}
      MINERU_302_BASE_URL: ${MINERU_302_BASE_URL:-https://api.302.ai}
      MINERU_302_UPLOAD_PATH: ${MINERU_302_UPLOAD_PATH:-/302/upload-file}
      MINERU_302_TASK_PATH: ${MINERU_302_TASK_PATH:-/302/v2/mineru/task}
      MINERU_302_POLL_INTERVAL_S: ${MINERU_302_POLL_INTERVAL_S:-5}
      MINERU_302_MAX_WAIT_S: ${MINERU_302_MAX_WAIT_S:-900}
      MINERU_302_COST_PER_PAGE: ${MINERU_302_COST_PER_PAGE:-0.02}
      MINERU_302_DAILY_BUDGET: ${MINERU_302_DAILY_BUDGET:-0}
      MINERU_302_BUDGET_WARN_RATIO: ${MINERU_302_BUDGET_WARN_RATIO:-0.8}
      MINERU_302_LONG_PENDING_S: ${MINERU_302_LONG_PENDING_S:-300}
      LIFECYCLE_WORKER_READY_FILE: /tmp/unorag-lifecycle-ready
      LIFECYCLE_WORKER_POLL_SECONDS: ${LIFECYCLE_WORKER_POLL_SECONDS:-1}
      LIFECYCLE_WORKER_LEASE_SECONDS: ${LIFECYCLE_WORKER_LEASE_SECONDS:-120}
      LIFECYCLE_WORKER_HEARTBEAT_SECONDS: ${LIFECYCLE_WORKER_HEARTBEAT_SECONDS:-30}
      LIFECYCLE_LOCAL_CAPACITY: ${LIFECYCLE_LOCAL_CAPACITY:-2}
      LIFECYCLE_MINERU_CAPACITY: ${LIFECYCLE_MINERU_CAPACITY:-1}
    volumes:
      - document_storage:/var/lib/unorag/documents
    depends_on:
      document-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/unorag-lifecycle-ready || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 2m
    networks:
      - internal

  # Optional migration cohort. It remains behind the explicit `dbos` profile
  # until cleanup rows are adopted by the operator.
  dbos-worker:
    profiles: ["dbos"]
    image: ${UNORAG_DBOS_WORKER_IMAGE:-unorag-web-worker:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: worker
    working_dir: /repo/apps/web
    restart: unless-stopped
    command: ["./node_modules/.bin/tsx", "src/worker/entry.ts"]
    environment:
      <<: *dbos-environment
      UNORAG_DBOS_EXECUTOR_ID: dbos-worker
      DBOS_ADMIN_PORT: "3001"
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL required}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-unorag_chunks}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-5000}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DOCUMENT_STORAGE_ROOT: /var/lib/unorag/documents
    volumes:
      - document_storage:/var/lib/unorag/documents
    depends_on:
      document-storage-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/dbos-healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 2m
    networks:
      - internal

  # Dispatch/reconciliation is deliberately separate from the executor: this
  # process uses DBOSClient and never recovers or executes workflows itself.
  dbos-control:
    profiles: ["dbos"]
    image: ${UNORAG_DBOS_WORKER_IMAGE:-unorag-web-worker:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: worker
    working_dir: /repo/apps/web
    restart: unless-stopped
    command: ["./node_modules/.bin/tsx", "src/worker/control-entry.ts"]
    environment:
      <<: *dbos-environment
      UNORAG_DBOS_EXECUTOR_ID: dbos-control
    depends_on:
      postgres:
        condition: service_healthy
      dbos-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "find /tmp/unorag-dbos-control-ready -mmin -1 -print 2>/dev/null | grep -q .",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    networks:
      - internal

  # Library mutation projection: app.outbox_events → FastAPI internal projectors.
  # Required for create/update/delete library to reach the RAG read model.
  outbox-worker:
    image: ${UNORAG_OUTBOX_IMAGE:-unorag-web-outbox:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: outbox
    working_dir: /repo/apps/web
    restart: unless-stopped
    command: ["node", "scripts/process-outbox.mjs", "--watch"]
    environment:
      DATABASE_URL: ${OUTBOX_DATABASE_URL:-postgresql://unorag_outbox_login:${UNORAG_OUTBOX_DB_PASSWORD:?UNORAG_OUTBOX_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      RAG_API_URL: http://api:8000
      UNORAG_INTERNAL_SECRET: ${UNORAG_INTERNAL_SECRET:?UNORAG_INTERNAL_SECRET required}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-2000}
      OUTBOX_LOCK_TIMEOUT_SECONDS: ${OUTBOX_LOCK_TIMEOUT_SECONDS:-300}
      OUTBOX_REQUEST_TIMEOUT_SECONDS: ${OUTBOX_REQUEST_TIMEOUT_SECONDS:-1800}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - internal

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unorag}
      POSTGRES_USER: ${POSTGRES_USER:-unorag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-unorag} -d ${POSTGRES_DB:-unorag}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  configure-db-roles:
    profiles: ["migrate"]
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-unorag}
      PGUSER: ${POSTGRES_USER:-unorag}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      UNORAG_WEB_DB_PASSWORD: ${UNORAG_WEB_DB_PASSWORD:?UNORAG_WEB_DB_PASSWORD required}
      UNORAG_API_DB_PASSWORD: ${UNORAG_API_DB_PASSWORD:?UNORAG_API_DB_PASSWORD required}
      UNORAG_WORKER_DB_PASSWORD: ${UNORAG_WORKER_DB_PASSWORD:?UNORAG_WORKER_DB_PASSWORD required}
      UNORAG_OUTBOX_DB_PASSWORD: ${UNORAG_OUTBOX_DB_PASSWORD:?UNORAG_OUTBOX_DB_PASSWORD required}
      UNORAG_RAG_READ_DB_PASSWORD: ${UNORAG_RAG_READ_DB_PASSWORD:?UNORAG_RAG_READ_DB_PASSWORD required}
      UNORAG_DBOS_DB_PASSWORD: ${UNORAG_DBOS_DB_PASSWORD:-dbos-profile-disabled}
      UNORAG_DBOS_DATABASE: ${UNORAG_DBOS_DATABASE:-unorag_dbos}
    volumes:
      - ../../ops/postgres:/opt/unorag/postgres:ro
    command:
      - sh
      - -ec
      - |
        test "$$UNORAG_DBOS_DB_PASSWORD" != "dbos-profile-disabled" || {
          echo "UNORAG_DBOS_DB_PASSWORD is required for database role configuration" >&2
          exit 1
        }
        psql -f /opt/unorag/postgres/configure-runtime-roles.sql
        psql -f /opt/unorag/postgres/configure-runtime-logins.sql
        psql -f /opt/unorag/postgres/verify-runtime-roles.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  inspect-lifecycle:
    profiles: ["ops"]
    image: ${UNORAG_OUTBOX_IMAGE:?UNORAG_OUTBOX_IMAGE required}
    working_dir: /repo/apps/web
    environment:
      # Operator-invoked, short-lived inspection. Runtime services never receive
      # this DDL-owner credential.
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:-postgresql://${POSTGRES_USER:-unorag}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
    command:
      - node
      - scripts/inspect-lifecycle.mjs
      - --fail-on-dead
      - --fail-on-stuck
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.13.2}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - internal

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  migrate-web:
    profiles: ["migrate"]
    # Distinct tag so migrator layers are not overwritten by the runtime web image.
    image: ${UNORAG_WEB_MIGRATOR_IMAGE:-unorag-web-migrator:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL:-postgresql://${POSTGRES_USER:-unorag}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  migrate-rag:
    profiles: ["migrate"]
    image: ${UNORAG_API_IMAGE:-unorag-api:local}
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    working_dir: /app
    environment:
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:-postgresql://${POSTGRES_USER:-unorag}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      PYTHONPATH: /app
    command: ["python", "scripts/apply_rag_migrations.py"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate-web:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"

  bootstrap:
    profiles: ["migrate"]
    image: ${UNORAG_OUTBOX_IMAGE:-unorag-web-outbox:local}
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      target: outbox
    working_dir: /repo/apps/web
    environment:
      # Bootstrap-only vars: use defaults so `compose config` works without
      # bootstrap.env. The bootstrap script still requires a real password at run.
      DATABASE_URL: ${WEB_DATABASE_URL:-postgresql://unorag_web_login:${UNORAG_WEB_DB_PASSWORD:?UNORAG_WEB_DB_PASSWORD required}@postgres:5432/${POSTGRES_DB:-unorag}}
      UNORAG_ORGANIZATION_ID: ${UNORAG_ORGANIZATION_ID:-00000000-0000-4000-8000-000000000001}
      UNORAG_WORKSPACE_ID: ${UNORAG_WORKSPACE_ID:-00000000-0000-4000-8000-000000000002}
      UNORAG_PRINCIPAL_ID: ${UNORAG_PRINCIPAL_ID:-00000000-0000-4000-8000-000000000003}
      UNORAG_ORGANIZATION_SLUG: ${UNORAG_ORGANIZATION_SLUG:-default}
      UNORAG_ORGANIZATION_NAME: ${UNORAG_ORGANIZATION_NAME:-UnoRAG Private Deployment}
      UNORAG_WORKSPACE_SLUG: ${UNORAG_WORKSPACE_SLUG:-default}
      UNORAG_WORKSPACE_NAME: ${UNORAG_WORKSPACE_NAME:-Default Workspace}
      UNORAG_ADMIN_SUBJECT: ${UNORAG_ADMIN_SUBJECT:-local-admin}
      UNORAG_ADMIN_EMAIL: ${UNORAG_ADMIN_EMAIL:-admin@example.com}
      UNORAG_ADMIN_NAME: ${UNORAG_ADMIN_NAME:-Local Administrator}
      UNORAG_ADMIN_PASSWORD: ${UNORAG_ADMIN_PASSWORD:-}
      UNORAG_ADMIN_PASSWORD_UPSERT: ${UNORAG_ADMIN_PASSWORD_UPSERT:-}
    command: ["node", "scripts/bootstrap-control-plane.mjs"]
    depends_on:
      migrate-rag:
        condition: service_completed_successfully
    networks:
      - internal
    restart: "no"

networks:
  # Edge: reverse proxy only. Do not attach FastAPI here.
  edge:
    driver: bridge
  # App backend. Ports for api/worker are unpublished (network isolation via
  # non-publish, not Docker "internal: true") so the data plane can still reach
  # customer LLM / embedding / MinerU endpoints.
  internal:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  document_storage:
