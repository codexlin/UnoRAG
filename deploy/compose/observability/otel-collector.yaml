extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: unorag-web
          metrics_path: /metrics
          static_configs:
            - targets: [web:3000]

processors:
  memory_limiter:
    check_interval: 2s
    limit_mib: 192
    spike_limit_mib: 48
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024
  attributes/privacy:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: gen_ai.prompt
        action: delete
      - key: gen_ai.completion
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: ai.prompt
        action: delete
      - key: ai.prompt.messages
        action: delete
      - key: ai.prompt.tools
        action: delete
      - key: ai.response.text
        action: delete
      - key: ai.response.object
        action: delete
      - key: ai.toolCall.args
        action: delete
      - key: ai.toolCall.result
        action: delete
      - key: ai.value
        action: delete
      - key: ai.values
        action: delete
      - key: ai.embedding
        action: delete
      - key: ai.embeddings
        action: delete
      - key: langfuse.observation.input
        action: delete
      - key: langfuse.observation.output
        action: delete
      - key: langfuse.trace.input
        action: delete
      - key: langfuse.trace.output
        action: delete
      - key: db.statement
        action: delete
  resource/privacy:
    attributes:
      - key: process.command
        action: delete
      - key: process.command_args
        action: delete
      - key: process.command_line
        action: delete
      - key: process.executable.path
        action: delete
      - key: process.owner
        action: delete
      - key: host.name
        action: delete

exporters:
  otlphttp/tempo:
    endpoint: http://tempo:4318
    timeout: 5s
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    timeout: 5s
    sending_queue:
      enabled: true
      queue_size: 5000
    retry_on_failure:
      enabled: true
      max_elapsed_time: 30s
  prometheus:
    endpoint: 0.0.0.0:9464

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: basic
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/privacy, attributes/privacy, batch]
      exporters: [otlphttp/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/privacy, attributes/privacy, batch]
      exporters: [otlphttp/loki]
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
