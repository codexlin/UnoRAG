{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meriknow.fullname" . }}-api
  labels:
    {{- include "meriknow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "meriknow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "meriknow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: APP_ENV
              value: {{ .Values.config.appEnv | quote }}
            - name: APP_NAME
              value: MeriKnow API
            - name: API_PREFIX
              value: /v1
            - name: CORS_ORIGINS
              value: {{ .Values.config.corsOrigins | quote }}
            - name: ASK_MODE
              value: {{ .Values.config.askMode | quote }}
            - name: METADATA_BACKEND
              value: {{ .Values.config.metadataBackend | quote }}
            - name: INTERNAL_AUTH_ENABLED
              value: {{ .Values.config.internalAuthEnabled | quote }}
            - name: INTERNAL_AUTH_REPLAY_BACKEND
              value: {{ .Values.config.internalAuthReplayBackend | quote }}
            - name: ACTIVE_GENERATION_GATE_ENABLED
              value: {{ .Values.config.activeGenerationGateEnabled | quote }}
            - name: ACTIVE_GENERATION_CACHE_TTL_SECONDS
              value: {{ .Values.config.activeGenerationCacheTtlSeconds | quote }}
            - name: MINERU_USE_FAKE
              value: "false"
            - name: QDRANT_URL
              value: {{ .Values.external.qdrant.url | quote }}
            - name: QDRANT_COLLECTION
              value: {{ .Values.external.qdrant.collection | quote }}
            - name: REDIS_URL
              value: {{ .Values.external.redis.url | quote }}
            - name: DOCUMENT_STORAGE_ROOT
              value: {{ .Values.documentStorageRoot | quote }}
            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.config.documentMaxUploadBytes | default "52428800" | quote }}
            - name: CHAT_MODEL
              value: {{ .Values.config.chatModel | quote }}
            - name: EMBEDDING_MODEL
              value: {{ .Values.config.embeddingModel | quote }}
            - name: EMBEDDING_DIM
              value: {{ .Values.config.embeddingDim | quote }}
            - name: EMBEDDING_BATCH_SIZE
              value: {{ .Values.config.embeddingBatchSize | default "10" | quote }}
            - name: LLM_MAX_INFLIGHT
              value: {{ .Values.config.llmMaxInflight | default "4" | quote }}
            - name: RERANK_MODEL
              value: {{ .Values.config.rerankModel | quote }}
            - name: RERANK_BASE_URL
              value: {{ .Values.config.rerankBaseUrl | quote }}
            - name: MINERU_ENABLED
              value: {{ .Values.config.mineruEnabled | quote }}
            - name: MINERU_URL
              value: {{ .Values.config.mineruUrl | quote }}
            - name: LIFECYCLE_WORKER_READY_FILE
              value: /tmp/meriknow-lifecycle-ready
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meriknow.secretName" . }}
                  key: API_DATABASE_URL
            - name: RAG_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "meriknow.secretName" . }}
                  key: RAG_READ_DATABASE_URL
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "meriknow.secretName" . }}
                  key: MERIKNOW_INTERNAL_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "meriknow.secretName" . }}
                  key: LLM_API_KEY
            - name: OPENAI_BASE_URL
              value: {{ .Values.config.openaiBaseUrl | default .Values.config.llmBaseUrl | quote }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: documents
              mountPath: {{ .Values.documentStorageRoot }}
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: documents
          persistentVolumeClaim:
            claimName: {{ include "meriknow.documentsPvcName" . }}
        {{- end }}
{{- end }}
