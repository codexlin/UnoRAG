{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meriknow.fullname" . }}-api
  labels:
    {{- include "meriknow.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # Fail-closed: ClusterIP only. Browser traffic must go through web Ingress.
  type: {{ .Values.service.api.type }}
  ports:
    - port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "meriknow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
