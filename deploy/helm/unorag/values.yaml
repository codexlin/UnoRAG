# UnoRAG Helm starter values (L8 deferred slice).
# External Postgres / Qdrant / Redis / object storage are customer-managed by default.
# Do not commit real secrets — use --set-file / ExternalSecret / sealed-secrets.

fullnameOverride: ""
nameOverride: ""

imagePullSecrets: []

# Pin tags before customer handoff. Digest locking / SBOM scanning are follow-ups.
images:
  web:
    repository: unorag-web
    tag: local
    pullPolicy: IfNotPresent
  migrator:
    repository: unorag-web-migrator
    tag: local
    pullPolicy: IfNotPresent
  dbosWorker:
    repository: unorag-web-worker
    tag: local
    pullPolicy: IfNotPresent
  ops:
    repository: unorag-web-ops
    tag: local
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Workloads
# ---------------------------------------------------------------------------
web:
  enabled: true
  replicaCount: 1
  port: 3000
  resources: {}
  # Readiness rejects traffic when a required Ask dependency is unavailable.
  readinessProbe:
    httpGet:
      path: /api/rag/health/ready
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  livenessProbe:
    httpGet:
      path: /api/rag/health/live
      port: http
    initialDelaySeconds: 40
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3

dbos:
  enabled: true
  workerReplicaCount: 1
  controlReplicaCount: 1
  applicationVersion: lifecycle-v2
  systemDatabasePoolSize: "10"
  ingestLocalConcurrency: "4"
  ingestAutoConcurrency: "2"
  ingestMineruConcurrency: "2"
  lifecycleConcurrency: "2"
  controlPollMs: "5000"
  askRunMaintenanceEnabled: "true"
  askRunMaintenanceIntervalMs: "900000"
  askRunStaleAfterMinutes: "30"
  askRunRetentionDays: "30"
  askRunMaintenanceBatchSize: "1000"
  observabilityCycleEnabled: "true"
  observabilityCycleIntervalMs: "60000"
  workerResources: {}
  controlResources: {}
  terminationGracePeriodSeconds: 120

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------
service:
  web:
    type: ClusterIP
    port: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: unorag.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # tls:
  #   - secretName: unorag-tls
  #     hosts: [unorag.example.com]

# Send traces and structured logs to a customer-managed OpenTelemetry Collector.
# The chart deliberately does not install Grafana/Tempo/Loki/Prometheus.
observability:
  otel:
    enabled: false
    endpoint: ""
    tracesSampler: parentbased_traceidratio
    tracesSamplerArg: "0.10"
    # Optional OTEL_EXPORTER_OTLP_HEADERS key in secret.existingSecret.
    headersSecretKey: OTEL_EXPORTER_OTLP_HEADERS

# ---------------------------------------------------------------------------
# Document object storage
# ---------------------------------------------------------------------------
# Default: shared PVC mounted by web + worker (+ api if needed for local files).
# For customer MinIO/S3: leave persistence disabled and point app config at S3
# once the object backend lands (currently Compose uses DOCUMENT_STORAGE_ROOT).
persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteMany
  size: 50Gi
  # existingClaim: unorag-documents

documentStorageRoot: /var/lib/unorag/documents

# ---------------------------------------------------------------------------
# External dependencies (customer-managed; not chart-installed)
# ---------------------------------------------------------------------------
# Provide connection strings via secret (recommended) or plain env below.
# Chart does NOT deploy Postgres / Qdrant / Redis / MinIO.
external:
  # postgresql://…  (control-plane / drizzle)
  postgres:
    # Set secret keys: DATABASE_URL, WORKER_DATABASE_URL, and
    # DBOS_SYSTEM_DATABASE_URL.
    existingSecret: ""
  qdrant:
    url: http://qdrant.external:6333
    collection: unorag_chunks
  redis:
    url: redis://redis.external:6379
  # Object notes: prefer customer S3/MinIO later; PVC is the starter path.
  objectStorage: pvc # pvc | s3 (s3 adapter deferred)

# ---------------------------------------------------------------------------
# Application config (non-secret)
# ---------------------------------------------------------------------------
config:
  appEnv: production
  chatModel: qwen-plus
  # Empty keeps the Judge on chatModel; set only after evaluation gates pass.
  judgeModel: ""
  judgeBaseUrl: ""
  judgeProviderName: ""
  judgeSupportsStructuredOutputs: "true"
  askJudgeTimeoutMs: "15000"
  askJudgeMaxAttempts: "2"
  askJudgeMaxOutputTokens: "1024"
  embeddingModel: text-embedding-v3
  embeddingDim: "1024"
  embeddingBatchSize: "10"
  rerankModel: qwen3-rerank
  mineruProvider: self_hosted
  mineruSelfHostedUrl: ""
  mineru302BaseUrl: https://api.302.ai
  externalParserAllowed: "false"
  mineruMode: auto
  mineruVersion: "2.5"
  parserPollIntervalMs: "250"
  parserMaxWaitMs: "900000"
  parserRetryBackoffMs: "2000,5000,15000,30000"
  # OpenAI-compatible model endpoint used by the native TypeScript runtime.
  openaiBaseUrl: ""
  llmBaseUrl: ""
  rerankBaseUrl: ""
  mineruUrl: ""
  databasePoolMax: "10"
  documentMaxUploadBytes: "52428800"
  emailProvider: none
  observabilityAlertWebhookEnabled: "false"
  observabilityAlertEmailEnabled: "false"

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
# Prefer existingSecret. Pods inject least-privilege keys (not full Secret via envFrom).
# Required keys (align with deploy/config/runtime.secret):
#   UNORAG_SESSION_SECRET
#   DATABASE_URL, WORKER_DATABASE_URL, DBOS_SYSTEM_DATABASE_URL
#   MIGRATOR_DATABASE_URL (migrate jobs only)
#   LLM_API_KEY
#   MINERU_API_KEY (optional for an authenticated self-hosted or 302.AI endpoint)
#   OTEL_EXPORTER_OTLP_HEADERS (optional when observability.otel.enabled=true)
#   OBSERVABILITY_ALERT_WEBHOOK_URL / OBSERVABILITY_ALERT_WEBHOOK_SECRET (optional)
#   OBSERVABILITY_ALERT_EMAIL_TO / EMAIL_FROM / RESEND_API_KEY (optional)
# Bootstrap admin password must NOT live in the long-running runtime Secret.
secret:
  create: false
  existingSecret: unorag-runtime
  # When create=true, fill placeholders locally via --set / values overlay (never commit):
  # data:
  #   UNORAG_SESSION_SECRET: ""
  #   DATABASE_URL: ""
  #   WORKER_DATABASE_URL: ""
  #   DBOS_SYSTEM_DATABASE_URL: ""
  #   MIGRATOR_DATABASE_URL: ""
  #   LLM_API_KEY: ""
  #   MINERU_API_KEY: ""

# ---------------------------------------------------------------------------
# Migration Jobs (opt-in; run as separate release step)
# ---------------------------------------------------------------------------
migrate:
  aclProjectionGate:
    # Independent from schema migrations so externally managed migrations
    # cannot silently bypass restricted-document convergence.
    enabled: true
  runtimeRoles:
    # Replays grants and verifies that every runtime DSN authenticates as the
    # fixed least-privilege login role documented by the chart.
    enabled: true
  web:
    enabled: false
    image:
      repository: unorag-web-migrator
      tag: local
      pullPolicy: IfNotPresent

# Release CI gates CVEs and emits digest manifests; SBOM/signing are deferred.
