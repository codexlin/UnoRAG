{{- if .Values.outboxWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unorag.fullname" . }}-outbox-worker
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: outbox-worker
spec:
  replicas: {{ .Values.outboxWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "unorag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: outbox-worker
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: outbox-worker
    spec:
      terminationGracePeriodSeconds: {{ .Values.outboxWorker.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: outbox-worker
          image: "{{ .Values.migrate.web.image.repository }}:{{ .Values.migrate.web.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.web.image.pullPolicy }}
          workingDir: /repo/apps/web
          command: ["node", "scripts/process-outbox.mjs", "--watch"]
          env:
            - name: RAG_API_URL
              value: {{ printf "http://%s-api:%v" (include "unorag.fullname" .) .Values.service.api.port | quote }}
            - name: OUTBOX_BATCH_SIZE
              value: {{ .Values.outboxWorker.batchSize | quote }}
            - name: OUTBOX_POLL_MS
              value: {{ .Values.outboxWorker.pollMs | quote }}
            - name: OUTBOX_LOCK_TIMEOUT_SECONDS
              value: {{ .Values.outboxWorker.lockTimeoutSeconds | quote }}
            - name: OUTBOX_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.outboxWorker.requestTimeoutSeconds | quote }}
            - name: OUTBOX_MAX_ATTEMPTS
              value: {{ .Values.outboxWorker.maxAttempts | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: DATABASE_URL
            - name: UNORAG_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: UNORAG_INTERNAL_SECRET
          resources:
            {{- toYaml .Values.outboxWorker.resources | nindent 12 }}
{{- end }}
