{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unorag.fullname" . }}-web
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "unorag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: RAG_API_URL
              value: {{ printf "http://%s-api:%v" (include "unorag.fullname" .) .Values.service.api.port | quote }}
            - name: DATABASE_POOL_MAX
              value: {{ .Values.config.databasePoolMax | default "10" | quote }}
            - name: DOCUMENT_STORAGE_ROOT
              value: {{ .Values.documentStorageRoot | quote }}
            - name: DOCUMENT_MAX_UPLOAD_BYTES
              value: {{ .Values.config.documentMaxUploadBytes | default "52428800" | quote }}
            - name: UNORAG_DBOS_DOCUMENT_DELETE_ENABLED
              value: {{ .Values.config.dbosDocumentDeleteEnabled | quote }}
            - name: UNORAG_DBOS_TEXT_INGEST_ENABLED
              value: {{ .Values.config.dbosTextIngestRouteEnabled | quote }}
            - name: UNORAG_DBOS_TEXT_INGEST_ROUTE_ENABLED
              value: {{ .Values.config.dbosTextIngestRouteEnabled | quote }}
            - name: UNORAG_DBOS_ACL_PROJECTION_ENABLED
              value: {{ .Values.config.dbosAclProjectionEnabled | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: DATABASE_URL
            - name: UNORAG_INTERNAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: UNORAG_INTERNAL_SECRET
            - name: UNORAG_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: UNORAG_SESSION_SECRET
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: documents
              mountPath: {{ .Values.documentStorageRoot }}
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.web.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.web.livenessProbe | nindent 12 }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: documents
          persistentVolumeClaim:
            claimName: {{ include "unorag.documentsPvcName" . }}
        {{- end }}
{{- end }}
