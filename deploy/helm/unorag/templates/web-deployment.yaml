{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "unorag.fullname" . }}-web
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "unorag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          envFrom:
            - configMapRef:
                name: {{ include "unorag.fullname" . }}-config
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: {{ .Values.web.port | quote }}
            - name: DATABASE_POOL_MAX
              value: {{ .Values.config.databasePoolMax | default "10" | quote }}
            - name: DOCUMENT_STORAGE_ROOT
              value: {{ .Values.documentStorageRoot | quote }}
            - name: DOCUMENT_MAX_UPLOAD_BYTES
              value: {{ .Values.config.documentMaxUploadBytes | default "52428800" | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: DATABASE_URL
            - name: UNORAG_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: UNORAG_SESSION_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: LLM_API_KEY
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: QDRANT_API_KEY
                  optional: true
            {{- range $key := list "OBSERVABILITY_ALERT_WEBHOOK_ENABLED" "OBSERVABILITY_ALERT_EMAIL_ENABLED" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "unorag.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: documents
              mountPath: {{ .Values.documentStorageRoot }}
            {{- end }}
          readinessProbe:
            {{- toYaml .Values.web.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.web.livenessProbe | nindent 12 }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: documents
          persistentVolumeClaim:
            claimName: {{ include "unorag.documentsPvcName" . }}
        {{- end }}
{{- end }}
