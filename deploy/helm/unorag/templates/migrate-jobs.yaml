apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "unorag.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrator
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.images.migrator.repository }}:{{ .Values.images.migrator.tag }}"
          imagePullPolicy: {{ .Values.images.migrator.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: MIGRATOR_DATABASE_URL
