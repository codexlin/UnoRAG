{{- if and (eq (toString .Values.config.dbosAclProjectionEnabled) "true") (not .Values.migrate.aclProjectionGate.enabled) }}
{{- fail "config.dbosAclProjectionEnabled=true requires migrate.aclProjectionGate.enabled=true" }}
{{- end }}
{{- if and (eq (toString .Values.config.dbosAclProjectionEnabled) "true") (not .Values.migrate.runtimeRoles.enabled) }}
{{- fail "config.dbosAclProjectionEnabled=true requires migrate.runtimeRoles.enabled=true" }}
{{- end }}
{{- if .Values.migrate.web.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "unorag.fullname" . }}-migrate-web
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-web
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate-web
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-web
          image: "{{ .Values.migrate.web.image.repository }}:{{ .Values.migrate.web.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.web.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: MIGRATOR_DATABASE_URL
{{- end }}
---
{{- if .Values.migrate.rag.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "unorag.fullname" . }}-migrate-rag
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate-rag
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate-rag
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate-rag
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["python", "scripts/apply_rag_migrations.py"]
          env:
            - name: MIGRATOR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: MIGRATOR_DATABASE_URL
{{- end }}
---
{{- if .Values.migrate.runtimeRoles.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "unorag.fullname" . }}-configure-runtime-roles
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: configure-runtime-roles
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: configure-runtime-roles
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: configure-runtime-roles
          image: "{{ .Values.migrate.web.image.repository }}:{{ .Values.migrate.web.image.tag }}"
          imagePullPolicy: {{ .Values.migrate.web.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              psql "$DATABASE_URL" \
                --file ./ops/postgres/configure-runtime-roles.sql
              assert_principal() {
                result="$(psql "$1" --no-psqlrc -v ON_ERROR_STOP=1 -AtF: -c "
                  WITH login AS (
                    SELECT oid, rolsuper, rolcreatedb, rolcreaterole,
                           rolreplication, rolbypassrls
                    FROM pg_roles
                    WHERE rolname = current_user
                  ),
                  duty AS (
                    SELECT oid, rolsuper, rolcreatedb, rolcreaterole,
                           rolreplication, rolbypassrls
                    FROM pg_roles
                    WHERE rolname = '$3'
                  )
                  SELECT
                    current_user,
                    NOT (login.rolsuper OR login.rolcreatedb OR
                         login.rolcreaterole OR login.rolreplication OR
                         login.rolbypassrls OR duty.rolsuper OR
                         duty.rolcreatedb OR duty.rolcreaterole OR
                         duty.rolreplication OR duty.rolbypassrls),
                    (
                      SELECT count(*) = 1 AND bool_and(
                        parent.rolname = '$3'
                        AND NOT membership.admin_option
                        AND coalesce(
                          (to_jsonb(membership)->>'inherit_option')::boolean,
                          true
                        )
                        AND NOT coalesce(
                          (to_jsonb(membership)->>'set_option')::boolean,
                          false
                        )
                      )
                      FROM pg_auth_members AS membership
                      JOIN pg_roles AS parent ON parent.oid = membership.roleid
                      WHERE membership.member = login.oid
                    ),
                    NOT EXISTS (
                      SELECT 1
                      FROM pg_auth_members
                      WHERE member = (SELECT oid FROM pg_roles WHERE rolname = '$3')
                    ),
                    NOT (
                      has_schema_privilege(current_user, 'app', 'CREATE') OR
                      has_schema_privilege(current_user, 'rag', 'CREATE') OR
                      has_schema_privilege(current_user, 'public', 'CREATE')
                    ),
                    NOT EXISTS (
                      SELECT 1
                      FROM pg_class AS relation
                      JOIN pg_namespace AS namespace
                        ON namespace.oid = relation.relnamespace
                      LEFT JOIN LATERAL aclexplode(relation.relacl) AS acl ON true
                      WHERE namespace.nspname IN ('app', 'rag', 'public')
                        AND (
                          relation.relowner IN (login.oid, duty.oid) OR
                          acl.grantee IN (login.oid, 0)
                        )
                    ),
                    NOT EXISTS (
                      SELECT 1
                      FROM pg_attribute AS attribute
                      JOIN pg_class AS relation ON relation.oid = attribute.attrelid
                      JOIN pg_namespace AS namespace
                        ON namespace.oid = relation.relnamespace
                      LEFT JOIN LATERAL aclexplode(attribute.attacl) AS acl ON true
                      WHERE namespace.nspname IN ('app', 'rag', 'public')
                        AND attribute.attnum > 0
                        AND NOT attribute.attisdropped
                        AND acl.grantee IN (login.oid, 0)
                    ),
                    NOT EXISTS (
                      SELECT 1
                      FROM pg_namespace AS namespace
                      LEFT JOIN LATERAL aclexplode(namespace.nspacl) AS acl ON true
                      WHERE namespace.nspname IN ('app', 'rag', 'public')
                        AND (
                          namespace.nspowner IN (login.oid, duty.oid) OR
                          acl.grantee = login.oid OR
                          (namespace.nspname IN ('app', 'rag') AND acl.grantee = 0)
                        )
                    ),
                    NOT EXISTS (
                      SELECT 1
                      FROM pg_proc AS routine
                      JOIN pg_namespace AS namespace
                        ON namespace.oid = routine.pronamespace
                      LEFT JOIN LATERAL aclexplode(
                        coalesce(routine.proacl, acldefault('f', routine.proowner))
                      ) AS acl ON true
                      WHERE namespace.nspname IN ('app', 'rag', 'public')
                        AND (
                          routine.proowner IN (login.oid, duty.oid) OR
                          acl.grantee = login.oid OR
                          (namespace.nspname IN ('app', 'rag') AND acl.grantee = 0)
                        )
                    ),
                    (
                      SELECT datdba NOT IN (login.oid, duty.oid)
                      FROM pg_database
                      WHERE datname = current_database()
                    ),
                    ($4)
                  FROM login, duty")"
                if [ "$result" != "$2:t:t:t:t:t:t:t:t:t:t" ]; then
                  echo "runtime DSN least-privilege mismatch for $2/$3: $result" >&2
                  exit 1
                fi
              }
              assert_principal "$WEB_DATABASE_URL" unorag_web_login unorag_web \
                "has_table_privilege(current_user, 'app.users', 'SELECT,INSERT,UPDATE,DELETE')
                 AND NOT has_table_privilege(current_user, 'public.turns', 'SELECT')"
              assert_principal "$OUTBOX_DATABASE_URL" unorag_outbox_login unorag_outbox \
                "has_table_privilege(current_user, 'app.outbox_events', 'SELECT,UPDATE')
                 AND NOT has_table_privilege(current_user, 'app.documents', 'SELECT')"
              assert_principal "$WORKER_DATABASE_URL" unorag_worker_login unorag_worker \
                "has_table_privilege(current_user, 'app.jobs', 'SELECT,UPDATE')
                 AND NOT has_table_privilege(current_user, 'app.users', 'SELECT')
                 AND NOT has_table_privilege(current_user, 'app.outbox_events', 'SELECT')"
              assert_principal "$RAG_READ_DATABASE_URL" unorag_rag_api_login unorag_rag_read \
                "has_column_privilege(current_user, 'app.documents', 'acl_fingerprint', 'SELECT')
                 AND NOT has_column_privilege(current_user, 'app.documents', 'filename', 'SELECT')
                 AND NOT has_table_privilege(current_user, 'app.documents', 'UPDATE')"
              API_PSQL_URL="$(printf '%s' "$API_DATABASE_URL" |
                sed 's#^postgresql+psycopg://#postgresql://#')"
              assert_principal "$API_PSQL_URL" unorag_api_login unorag_api \
                "has_table_privilege(current_user, 'public.turns', 'SELECT,INSERT,UPDATE,DELETE')
                 AND NOT has_schema_privilege(current_user, 'app', 'USAGE')"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: MIGRATOR_DATABASE_URL
            - name: WEB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: DATABASE_URL
            - name: OUTBOX_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: OUTBOX_DATABASE_URL
            - name: WORKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: WORKER_DATABASE_URL
            - name: RAG_READ_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: RAG_READ_DATABASE_URL
            - name: API_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: API_DATABASE_URL
{{- end }}
---
{{- if .Values.migrate.aclProjectionGate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "unorag.fullname" . }}-acl-projection-gate
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
    app.kubernetes.io/component: acl-projection-gate
  annotations:
    {{- if .Release.IsInstall }}
    helm.sh/hook: post-install
    helm.sh/hook-weight: "5"
    {{- else if eq (toString .Values.config.dbosAclProjectionEnabled) "true" }}
    # Once the capability is live, every later upgrade must converge ACLs
    # before Kubernetes changes any application workload.
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-2"
    {{- else }}
    # The first compatibility release installs the capable DBOS worker before
    # backfilling. Keep ACL mutation routing disabled for this release.
    helm.sh/hook: post-upgrade
    helm.sh/hook-weight: "5"
    {{- end }}
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "unorag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: acl-projection-gate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: acl-projection-gate
          image: "{{ .Values.images.outbox.repository }}:{{ .Values.images.outbox.tag }}"
          imagePullPolicy: {{ .Values.images.outbox.pullPolicy }}
          workingDir: /repo/apps/web
          command:
            - /bin/sh
            - -ec
            - |
              node scripts/backfill-acl-projections.mjs --apply
              attempt=0
              until node scripts/inspect-lifecycle.mjs --fail-on-acl-projection; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 120 ]; then
                  echo "ACL projections did not converge within 10 minutes" >&2
                  exit 1
                fi
                sleep 5
              done
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "unorag.secretName" . }}
                  key: MIGRATOR_DATABASE_URL
{{- end }}
