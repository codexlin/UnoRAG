{{- if not (has .Values.objectStorage.driver (list "local" "cos")) }}
{{- fail "objectStorage.driver must be local or cos" }}
{{- end }}
{{- if and (eq .Values.objectStorage.driver "local") (not .Values.persistence.enabled) }}
{{- fail "local object storage requires persistence.enabled=true" }}
{{- end }}
{{- if and (eq .Values.objectStorage.driver "cos") .Values.persistence.enabled }}
{{- fail "COS object storage requires persistence.enabled=false" }}
{{- end }}
{{- if and (eq .Values.objectStorage.driver "cos") (or (not .Values.objectStorage.cos.bucket) (not .Values.objectStorage.cos.region)) }}
{{- fail "COS object storage requires objectStorage.cos.bucket and objectStorage.cos.region" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "unorag.fullname" . }}-config
  labels:
    {{- include "unorag.labels" . | nindent 4 }}
data:
  CHAT_MODEL: {{ .Values.config.chatModel | quote }}
  JUDGE_MODEL: {{ .Values.config.judgeModel | quote }}
  JUDGE_BASE_URL: {{ .Values.config.judgeBaseUrl | quote }}
  JUDGE_PROVIDER_NAME: {{ .Values.config.judgeProviderName | quote }}
  JUDGE_SUPPORTS_STRUCTURED_OUTPUTS: {{ .Values.config.judgeSupportsStructuredOutputs | quote }}
  ASK_JUDGE_TIMEOUT_MS: {{ .Values.config.askJudgeTimeoutMs | quote }}
  ASK_JUDGE_MAX_ATTEMPTS: {{ .Values.config.askJudgeMaxAttempts | quote }}
  ASK_JUDGE_MAX_OUTPUT_TOKENS: {{ .Values.config.askJudgeMaxOutputTokens | quote }}
  EMBEDDING_MODEL: {{ .Values.config.embeddingModel | quote }}
  EMBEDDING_DIM: {{ .Values.config.embeddingDim | quote }}
  RERANK_MODEL: {{ .Values.config.rerankModel | quote }}
  MINERU_PROVIDER: {{ .Values.config.mineruProvider | quote }}
  MINERU_SELF_HOSTED_URL: {{ .Values.config.mineruSelfHostedUrl | quote }}
  MINERU_302_BASE_URL: {{ .Values.config.mineru302BaseUrl | quote }}
  EXTERNAL_PARSER_ALLOWED: {{ .Values.config.externalParserAllowed | quote }}
  MINERU_MODE: {{ .Values.config.mineruMode | quote }}
  MINERU_VERSION: {{ .Values.config.mineruVersion | quote }}
  OPENAI_BASE_URL: {{ .Values.config.openaiBaseUrl | quote }}
  RERANK_BASE_URL: {{ .Values.config.rerankBaseUrl | quote }}
  MINERU_URL: {{ .Values.config.mineruUrl | quote }}
  QDRANT_URL: {{ .Values.external.qdrant.url | quote }}
  QDRANT_COLLECTION: {{ .Values.external.qdrant.collection | quote }}
  REDIS_URL: {{ .Values.external.redis.url | quote }}
  DOCUMENT_STORAGE_ROOT: {{ .Values.documentStorageRoot | quote }}
  DOCUMENT_STORAGE_DRIVER: {{ .Values.objectStorage.driver | quote }}
  COS_BUCKET: {{ .Values.objectStorage.cos.bucket | quote }}
  COS_REGION: {{ .Values.objectStorage.cos.region | quote }}
  COS_PUBLIC_BASE_URL: {{ .Values.objectStorage.cos.publicBaseUrl | quote }}
  EMAIL_PROVIDER: {{ .Values.config.emailProvider | quote }}
  OBSERVABILITY_ALERT_WEBHOOK_ENABLED: {{ .Values.config.observabilityAlertWebhookEnabled | quote }}
  OBSERVABILITY_ALERT_EMAIL_ENABLED: {{ .Values.config.observabilityAlertEmailEnabled | quote }}
